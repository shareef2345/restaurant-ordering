{% extends "base.html" %}
{% block content %}
<h2>Orders — {{ restaurant.name }}</h2>
{% for order in orders %}
<div class="card mb-2 shadow-sm">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <strong>Order #{{ order.id }}</strong> — {{ order.customer.username }}
            <br><small class="text-muted">{{ order.created_at }} · ₹{{ order.total }}</small>
        </div>
        <form method="post" action="{% url 'update_order_status' order.pk %}" class="d-flex gap-2">
            {% csrf_token %}
            <select name="status" class="form-select form-select-sm">
                {% for value, label in order.STATUS_CHOICES %}
                <option value="{{ value }}" {% if value == order.status %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-sm btn-primary">Update</button>
        </form>
    </div>
</div>
{% empty %}
<p class="text-muted">No orders yet.</p>
{% endfor %}
<a href="{% url 'owner_dashboard' %}" class="btn btn-link">&larr; Back to Dashboard</a>
{% endblock %}
