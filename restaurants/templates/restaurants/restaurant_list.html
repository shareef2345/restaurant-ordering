{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Restaurants</h2>

<form method="get" class="row g-2 mb-4">
    <div class="col-auto">
        <select name="cuisine" class="form-select" onchange="this.form.submit()">
            <option value="">All Cuisines</option>
            {% for c in cuisines %}
                <option value="{{ c }}" {% if c == selected_cuisine %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
    </div>
</form>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for restaurant in restaurants %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ restaurant.name }}</h5>
                <h6 class="card-subtitle mb-2 text-muted">{{ restaurant.cuisine }} · {{ restaurant.city }}</h6>
                <a href="{% url 'restaurant_detail' restaurant.pk %}" class="btn btn-primary btn-sm mt-2">View Menu</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p class="text-muted">No restaurants found.</p>
    {% endfor %}
</div>
{% endblock %}
