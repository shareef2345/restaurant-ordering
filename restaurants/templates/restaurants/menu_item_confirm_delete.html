{% extends "base.html" %}
{% block content %}
<h2>Delete "{{ item.name }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'menu_item_list' restaurant.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
