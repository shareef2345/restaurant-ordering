{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>My Restaurants</h2>
    <a href="{% url 'restaurant_create' %}" class="btn btn-primary">+ New Restaurant</a>
</div>
{% for restaurant in restaurants %}
<div class="card mb-2 shadow-sm">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0">{{ restaurant.name }}</h5>
            <small class="text-muted">{{ restaurant.cuisine }} · {{ restaurant.city }}</small>
        </div>
        <div>
            <a href="{% url 'menu_item_list' restaurant.pk %}" class="btn btn-sm btn-outline-primary">Menu</a>
            <a href="{% url 'owner_orders' restaurant.pk %}" class="btn btn-sm btn-outline-success">Orders</a>
            <a href="{% url 'restaurant_edit' restaurant.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
        </div>
    </div>
</div>
{% empty %}
<p class="text-muted">You don't have any restaurants yet.</p>
{% endfor %}
{% endblock %}
