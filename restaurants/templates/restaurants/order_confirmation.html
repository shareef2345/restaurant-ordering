{% extends "base.html" %}
{% block content %}
<div class="text-center py-5">
    <h2>✅ Order Placed!</h2>
    <p>Order #{{ order.id }} — Total: ₹{{ order.total }}</p>
    <p class="text-muted">Status: {{ order.status }}</p>
    <a href="{% url 'restaurant_list' %}" class="btn btn-primary mt-3">Order Again</a>
</div>
{% endblock %}
