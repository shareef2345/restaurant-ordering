<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Restaurant Ordering{% endblock %}</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🍽️ Restaurant Ordering</a>
            <div>
                <a href="{% url 'restaurant_list' %}" class="btn btn-outline-light btn-sm me-2">Browse Restaurants</a>
                {% if user.is_authenticated %}
                    {% if user.profile.role == "OWNER" %}
                        <a href="{% url 'owner_dashboard' %}" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-speedometer2"></i> My Dashboard</a>
                    {% else %}
                        <a href="{% url 'cart_detail' %}" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-cart3"></i> Cart</a>
                        <a href="{% url 'order_history' %}" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-receipt"></i> My Orders</a>
                    {% endif %}
                    <span class="text-light me-3">Hi, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                    <a href="{% url 'signup' %}" class="btn btn-light btn-sm"><i class="bi bi-person-plus"></i> Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
